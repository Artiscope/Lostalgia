<style>
  html.lt-intro-active,
  html.lt-intro-active body { overflow: hidden; }

  #lt-intro {
    --w: clamp(150px, 21vw, 250px);
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.55s ease;
  }
  #lt-intro.is-out { opacity: 0; pointer-events: none; }

  .lt-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--w) * 0.1);
  }

  /* Each Game Boy rises into place */
  .lt-slot {
    opacity: 0;
    transform: translateY(60px);
    animation: lt-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes lt-rise { to { opacity: 1; transform: none; } }

  .lt-zoom {
    will-change: transform;
    transition: opacity 0.5s ease;
  }
  #lt-intro.is-zoom .lt-slot:not(.lt-slot--hero) .lt-zoom { opacity: 0; }

  /* The Game Boy, drawn in plain CSS */
  .lt-gb {
    --k: 1;
    position: relative;
    width: calc(var(--w) * var(--k));
    aspect-ratio: 90 / 148;
    rotate: var(--r, 0deg);
    translate: 0 var(--y, 0);
    filter: drop-shadow(0 18px 30px rgba(255, 255, 255, 0.06));
  }
  .lt-gb__body {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #e4e4e4, #bcbcbc);
    border-radius: 5% 5% 22% 5% / 3% 3% 13% 3%;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), inset 0 2px 0 rgba(255, 255, 255, 0.7);
  }
  .lt-gb__bezel {
    position: absolute;
    left: 7%;
    top: 4.5%;
    width: 86%;
    height: 45%;
    background: #3d3d3f;
    border-radius: 4% 4% 14% 4% / 3% 3% 8% 3%;
  }
  .lt-gb__bezel::before {
    content: "";
    position: absolute;
    left: 4.5%;
    top: 42%;
    width: 3%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #9a9a9a;
  }
  .lt-gb__screen {
    position: absolute;
    left: 15.7%;
    top: 12%;
    width: 68.6%;
    height: 72.2%;
    background: #4a4a4a;
    border-radius: 2%;
    overflow: hidden;
    container-type: inline-size;
    transition: background 0.35s ease;
  }
  .lt-gb__screen.is-on { background: #ececec; }
  .lt-gb__screen::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    background: repeating-linear-gradient(0deg, #fff 0 2px, #000 2px 4px);
  }
  .lt-gb__screen.is-static::after {
    opacity: 0.45;
    animation: lt-noise 0.12s steps(2) infinite;
  }
  @keyframes lt-noise { to { background-position: 0 4px; } }

  .lt-gb__dpad {
    position: absolute;
    left: 10%;
    top: 63%;
    width: 27%;
    aspect-ratio: 1;
  }
  .lt-gb__dpad::before,
  .lt-gb__dpad::after {
    content: "";
    position: absolute;
    background: #2a2a2a;
    border-radius: 8%;
  }
  .lt-gb__dpad::before { left: 0; right: 0; top: 34%; height: 32%; }
  .lt-gb__dpad::after { top: 0; bottom: 0; left: 34%; width: 32%; }

  .lt-gb__ab {
    position: absolute;
    right: 8%;
    top: 62%;
    width: 38%;
    aspect-ratio: 1;
  }
  .lt-gb__ab i {
    position: absolute;
    width: 42%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #2e2e2e;
    box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.12);
  }
  .lt-gb__ab .b { left: 4%; top: 48%; }
  .lt-gb__ab .a { left: 54%; top: 18%; }

  .lt-gb__ss {
    position: absolute;
    left: 30%;
    top: 87%;
    width: 32%;
    height: 3.6%;
    display: flex;
    gap: 12%;
  }
  .lt-gb__ss i {
    width: 44%;
    height: 100%;
    background: #8d8d8d;
    border-radius: 99px;
    rotate: -25deg;
  }
  .lt-gb__speaker {
    position: absolute;
    right: 7%;
    bottom: 5%;
    width: 24%;
    height: 12%;
    display: flex;
    gap: 8%;
    rotate: -28deg;
  }
  .lt-gb__speaker i { flex: 1; background: #8f8f8f; border-radius: 99px; }

  /* Boot screen on the centre Game Boy */
  .lt-logo {
    position: absolute;
    left: 0;
    right: 0;
    top: 34%;
    text-align: center;
    font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    font-size: 8.6cqw;
    color: #111;
    opacity: 0;
    transform: translateY(-160%);
  }
  .lt-gb.is-boot .lt-logo { animation: lt-drop 1.25s steps(16, end) forwards; }
  @keyframes lt-drop {
    0% { opacity: 1; transform: translateY(-160%); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .lt-press {
    position: absolute;
    left: 0;
    right: 0;
    top: 62%;
    text-align: center;
    font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    font-size: 4.4cqw;
    color: #111;
    opacity: 0;
  }
  .lt-gb.is-press .lt-press { opacity: 1; animation: lt-blink 0.7s steps(1) infinite; }
  @keyframes lt-blink { 50% { opacity: 0; } }
  .lt-gb.is-clear .lt-logo,
  .lt-gb.is-clear .lt-press { animation: none; opacity: 0; }

  .lt-skip {
    position: absolute;
    right: 20px;
    bottom: 20px;
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 9px 14px;
    font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    cursor: pointer;
    opacity: 0.7;
  }
  .lt-skip:hover { opacity: 1; }

  @media (max-width: 700px) {
    #lt-intro { --w: clamp(120px, 30vw, 200px); }
    .lt-slot--far { display: none; }
  }
</style>

<script>
(function () {
  /* Timings in milliseconds. Lower them all to make the intro shorter. */
  var T = {
    othersOn: 1300,
    heroStatic: 1500,
    heroOn: 1950,
    boot: 2150,
    press: 3500,
    zoom: 4700,
    zoomLength: 1500,
    clear: 5500,
    finish: 6100
  };

  var replay = /[?&]intro\b/.test(location.search);
  var seen = false;
  try { seen = sessionStorage.getItem('ltIntroSeen') === '1'; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ((seen && !replay) || reduce) return;

  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap';
  document.head.appendChild(link);

  var slots = [
    { c: 'far',  k: 0.55, r: '-9deg', y: '8%', d: 0.55 },
    { c: 'mid',  k: 0.78, r: '-5deg', y: '4%', d: 0.30 },
    { c: 'hero', k: 1,    r: '0deg',  y: '0',  d: 0.05 },
    { c: 'mid',  k: 0.78, r: '5deg',  y: '4%', d: 0.30 },
    { c: 'far',  k: 0.55, r: '9deg',  y: '8%', d: 0.55 }
  ];

  var root = document.createElement('div');
  root.id = 'lt-intro';
  var stage = document.createElement('div');
  stage.className = 'lt-stage';
  stage.setAttribute('aria-hidden', 'true');

  slots.forEach(function (s) {
    var hero = s.c === 'hero';
    var slot = document.createElement('div');
    slot.className = 'lt-slot lt-slot--' + s.c;
    slot.style.setProperty('--d', s.d + 's');
    slot.innerHTML =
      '<div class="lt-zoom"><div class="lt-gb" style="--k:' + s.k + ';--r:' + s.r + ';--y:' + s.y + '">' +
        '<div class="lt-gb__body">' +
          '<div class="lt-gb__bezel"><div class="lt-gb__screen">' +
            (hero ? '<div class="lt-logo">LOS-TALGIA</div><div class="lt-press">PRESS START</div>' : '') +
          '</div></div>' +
          '<div class="lt-gb__dpad"></div>' +
          '<div class="lt-gb__ab"><i class="b"></i><i class="a"></i></div>' +
          '<div class="lt-gb__ss"><i></i><i></i></div>' +
          '<div class="lt-gb__speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
        '</div></div></div>';
    stage.appendChild(slot);
  });

  var skip = document.createElement('button');
  skip.type = 'button';
  skip.className = 'lt-skip';
  skip.textContent = 'SKIP';

  root.appendChild(stage);
  root.appendChild(skip);
  document.body.appendChild(root);
  document.documentElement.classList.add('lt-intro-active');

  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    try { sessionStorage.setItem('ltIntroSeen', '1'); } catch (e) {}
    root.classList.add('is-out');
    setTimeout(function () {
      root.remove();
      document.documentElement.classList.remove('lt-intro-active');
      window.dispatchEvent(new Event('lt-intro-done'));
    }, 600);
  }
  skip.addEventListener('click', finish);
  at(9000, finish);

  var allScreens = root.querySelectorAll('.lt-gb__screen');
  var heroSlot = root.querySelector('.lt-slot--hero');
  var heroGb = heroSlot.querySelector('.lt-gb');
  var heroScreen = heroSlot.querySelector('.lt-gb__screen');
  var heroZoom = heroSlot.querySelector('.lt-zoom');

  function powerOn(screen, startDelay) {
    at(startDelay, function () { screen.classList.add('is-static'); });
    at(startDelay + 450, function () {
      screen.classList.remove('is-static');
      screen.classList.add('is-on');
    });
  }

  function zoomIn() {
    root.classList.add('is-zoom');
    var vw = window.innerWidth, vh = window.innerHeight;
    var sr = heroScreen.getBoundingClientRect();
    var zr = heroZoom.getBoundingClientRect();
    var cx = sr.left + sr.width / 2;
    var cy = sr.top + sr.height / 2;
    var scale = Math.max(vw / sr.width, vh / sr.height) * 1.03;
    heroZoom.style.transformOrigin = (cx - zr.left) + 'px ' + (cy - zr.top) + 'px';
    heroZoom.style.transition = 'transform ' + T.zoomLength + 'ms cubic-bezier(0.76, 0, 0.24, 1)';
    heroZoom.style.transform =
      'translate(' + (vw / 2 - cx) + 'px,' + (vh / 2 - cy) + 'px) scale(' + scale + ')';
  }

  function start() {
    var i = 0;
    allScreens.forEach(function (s) {
      if (s === heroScreen) return;
      powerOn(s, T.othersOn + i * 120);
      i++;
    });
    powerOn(heroScreen, T.heroStatic);
    at(T.boot, function () { heroGb.classList.add('is-boot'); });
    at(T.press, function () { heroGb.classList.add('is-press'); });
    at(T.zoom, zoomIn);
    at(T.clear, function () { heroGb.classList.add('is-clear'); });
    at(T.finish, finish);
  }

  /* Wait briefly for the pixel font so the title sizes correctly */
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var started = false;
  function go() { if (started) return; started = true; start(); }
  fontsReady.then(go);
  setTimeout(go, 1200);
})();
</script>
